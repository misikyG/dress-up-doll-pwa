  <style id="theme-variables">
    :root {    
      /* 1. 主題色 */
      --color-primary: #a595d1;
      
      /* 2. 主背景色 */
      --color-bg-main: #f8f5ea;
      
      /* 4. 面板背景色 */
      --color-bg-panel: #c6d3ac;
      
      /* 5. 主卡片顏色 */
      --color-bg-card: #ffffff;
      
      /* 6. 畫布顏色 */
      --color-bg-canvas: #f0f2f5;
      
      /* 7. 主要文字色 */
      --color-text-primary: #766258;
      
      /* 8. 次要文字色 (加深以確保在面板背景上的對比度 >= 4.5:1) */
      --color-text-secondary: #7c7c7c;
      
      /* 8. 邊框色 */
      --color-border: #c6b99b;
      
      /* 9. 成功色 */
      --color-success: #709172;
      
      /* 12. 錯誤色 */
      --color-error: #ad4b44;
      
      /* 13. 警告色 */
      --color-warning: #f5bb64;
      
      /* 14. 資訊色 */
      --color-info: #71a2ca;
      
      /* ========================================
         陰影 (使用主題色的半透明)
         ======================================== */
      --shadow-sm: 0 1px 3px rgba(119, 98, 88, 0.05);
      --shadow-md: 0 2px 8px rgba(119, 98, 88, 0.08);
      --shadow-lg: 0 4px 12px rgba(119, 98, 88, 0.12);
      --shadow-xl: 0 8px 24px rgba(119, 98, 88, 0.15);
      
      /* ========================================
         尺寸變數
         ======================================== */
      --panel-width: 320px;
      --wardrobe-width: clamp(320px, 28vw, 500px);
      --controls-width: clamp(300px, 26vw, 420px);
      --wardrobe-sidebar-width: clamp(150px, 15vw, 210px);
      --collapsed-width: 50px;
      --handle-width: 20px;
      
      /* 圓角 */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 50%;
      
      /* 轉場動畫 */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
    }
  </style>
  <style id="custom-css"></style>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('theme-settings-cache');
        if (!raw) return;
        var t = JSON.parse(raw);
        var colors = t._resolvedColors || null;
        if (!colors && t.previewColors && Object.keys(t.previewColors).length > 0) {
          colors = t.previewColors;
        }
        if (!colors && t.currentTheme && t.currentTheme !== 'default') {
          var themes = t.customThemes || [];
          for (var i = 0; i < themes.length; i++) {
            if (themes[i].id === t.currentTheme && themes[i].colors) {
              colors = themes[i].colors; break;
            }
          }
        }
        if (colors) {
          var root = document.documentElement;
          for (var key in colors) {
            if (colors.hasOwnProperty(key)) root.style.setProperty('--' + key, colors[key]);
          }
        }
        if (t.customCSS) {
          var el = document.getElementById('custom-css');
          if (el) el.textContent = t.customCSS;
        }
        if (t.fontSize && t.fontSize !== 16) {
          document.documentElement.style.setProperty('--app-base-font-size', t.fontSize + 'px');
          document.documentElement.style.fontSize = t.fontSize + 'px';
        }
      } catch(e) {}
    })();
  </script>
